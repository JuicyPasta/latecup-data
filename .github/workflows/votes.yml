name: votes

# About hourly: count visitor confirmations, ratings and "hours wrong" reports
# from the report form into v1/nyc-votes.json. No OSM pull. Only aggregated
# counts are published; the rows and install ids never leave the runner, and
# nothing from them is printed.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# the same group as `refresh`: both publish the whole gh-pages branch
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch the published feed
        run: |
          git clone --quiet --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" site
          rm -rf site/.git

      - name: Count
        id: count
        env:
          REPORTS_CSV_URL: ${{ secrets.REPORTS_CSV_URL }}
        run: python -m latecup_data.votes --site site

      - name: Publish (single-commit gh-pages)
        if: steps.count.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init --quiet --initial-branch gh-pages
          git config user.name "latecup-data pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Votes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

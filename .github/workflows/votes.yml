name: votes

# About hourly: count visitor confirmations, ratings, "hours wrong" reports
# and visitors' own hours from the report form into v1/<area>-votes.json. No
# OSM pull. Only aggregated counts are published; the rows and install ids
# never leave the runner, and nothing from them is printed.
#
# When visitors' hours have earned their place (README, "Visitors' hours"),
# the job also commits the changed visitors/ files to main, one commit per
# record, and starts `refresh`, which builds them into the feed. A push made
# with this job's own token does not start other workflows; a
# workflow_dispatch does.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

# contents: the votes files on gh-pages and the visitors/ records on main.
# actions: starting `refresh`. Nothing else.
permissions:
  contents: write
  actions: write

# the same group as `refresh`: both publish the whole gh-pages branch
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # the whole history: it says which visitors' records a person removed
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch the published feed
        run: |
          git clone --quiet --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" site
          rm -rf site/.git

      - name: Count
        id: count
        env:
          REPORTS_CSV_URL: ${{ secrets.REPORTS_CSV_URL }}
        run: python -m latecup_data.votes --site site --repo . --plan "$RUNNER_TEMP/ledger.json"

      - name: Publish (single-commit gh-pages)
        if: steps.count.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd site
          git init --quiet --initial-branch gh-pages
          git config user.name "latecup-data pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Votes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # One commit per record, on top of whatever the hours desk pushed in
      # the meantime (fetch, rebase, push, and again when someone was
      # faster; never forced). Only from main: a run started by hand on
      # another branch counts and publishes as above and writes nothing to
      # main. The step itself refuses to push anything but visitors/ files.
      - name: Commit the visitors' records to main
        id: ledger
        if: steps.count.outputs.ledger == 'true' && github.ref == 'refs/heads/main'
        run: python -m latecup_data.ledger "$RUNNER_TEMP/ledger.json" --branch main

      - name: Start refresh
        if: steps.ledger.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3; do
            gh workflow run refresh.yml --ref main && exit 0
            sleep 10
          done
          echo "::error::the records are on main but refresh could not be started; the next daily run builds them"
          exit 1

      # When something in the rules for visitors' hours fails, the count leaves
      # that part out and goes on, so the confirmations and ratings above are
      # published all the same. This is what tells the owner.
      - name: Fail when visitors' hours were left out
        if: steps.count.outputs.problem == 'true'
        run: |
          echo "::error::visitors' hours were left out of this run; the Count step says where"
          exit 1

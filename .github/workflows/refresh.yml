name: refresh

# Daily: OSM pull -> pipeline -> overrides -> validate -> publish, for every
# live area (areas/*.json).
#
# Each area stands alone. One whose pull failed, whose new feed fails
# validation or lost more than 20 % of its places keeps its last good file;
# the others are published, and the job summary says which were kept and why.
# When it is New York that was kept, the others are still published and then
# the job fails (GitHub emails the owner). When no area could be built, or
# the manifest as a whole does not validate, nothing is published: the job
# fails and the last good feed stays up.
#
# What switches.json turns on needs no edit here: the run reads it. With
# "chain_layer" it builds with the chains' own store locators (All The
# Places), whose files are kept between runs in the Actions cache.
on:
  schedule:
    # 04:17 or 05:17 in New York, after the late night; the second run is the
    # retry for a morning when every Overpass server was busy (an unchanged
    # feed keeps its hash, so a second good run costs clients nothing)
    - cron: "17 9 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Publish even if an area lost more than 20 % of its places
        type: boolean
        default: false
      areas:
        description: Build only these areas (ids with spaces between) and leave the others as they are. Empty = every live area
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["overrides/**", "additions/**", "visitors/**", "areas/**", "switches.json", "styles/**", "report.json",
            "latecup_data/**", "data/**"]

permissions:
  contents: write

# the same group as `votes`: both publish the whole gh-pages branch
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # the pull stops by itself after 20 minutes (osm.BUDGET), All The Places' downloads after 6 (atp.DOWNLOAD_BUDGET),
    # the address lookups after 4; everything else is seconds
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Tests (parser, classifier, validator)
        run: python -m pytest -q

      - name: Fetch the published feed
        run: |
          git clone --quiet --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" site || mkdir -p site
          rm -rf site/.git

      # The chain layer's downloads. Asked for on every run: with the switch off there is nothing to restore and
      # nothing is saved. The key never matches; the newest cache whose name starts with "atp-" is the one restored.
      - name: Restore All The Places' files
        id: atp
        uses: actions/cache/restore@v6
        with:
          path: work/atp
          key: atp-${{ github.run_id }}
          restore-keys: atp-

      - name: Build
        id: build
        env:
          ALLOW: ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
          AREAS: ${{ inputs.areas }}
        run: |
          only=""
          for area in $AREAS; do only="$only --area $area"; done
          echo "only=$only" >> "$GITHUB_OUTPUT"
          code=0
          python -m latecup_data.run --site site --save-osm-dir work/pulls $only $ALLOW || code=$?
          # 2: published, but New York was kept from the last good feed. The last step fails the job for it
          [ "$code" = 0 ] || [ "$code" = 2 ] || exit "$code"

      # A week's files are about 35 MB. The build reads the newest five runs, so older ones go; a new cache is
      # saved only when the set of files changed (All The Places publishes a run a week).
      - name: Name the cache of All The Places' files
        id: atpkey
        if: always() && hashFiles('work/atp/latest.json') != ''
        run: |
          ls -d work/atp/20* 2>/dev/null | sort -r | tail -n +6 | xargs -r rm -rf
          echo "key=atp-$(cd work/atp && find . -type f | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Save All The Places' files
        if: always() && steps.atpkey.outputs.key != '' && steps.atpkey.outputs.key != steps.atp.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: work/atp
          key: ${{ steps.atpkey.outputs.key }}

      # New addresses mean a second build: from the pull the first one saved, and from the chain layer's files as
      # the first one left them (no network, so it cannot hang). If the lookup or that build fails, the first
      # build is what gets published.
      - name: Look up missing street addresses (at most 40 a run, in every area)
        id: addresses
        continue-on-error: true
        env:
          ONLY: ${{ steps.build.outputs.only }}
        run: |
          python tools/fill_addresses.py site --max 40 --budget 240
          if ! git diff --quiet -- data/addresses.json || [ -n "$(git status --porcelain data/addresses.json)" ]; then
            code=0
            python -m latecup_data.run --site site --osm-dir work/pulls --chains-offline $ONLY || code=$?
            [ "$code" = 0 ] || [ "$code" = 2 ] || exit "$code"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (single-commit gh-pages)
        if: steps.build.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs
          python -m latecup_data.report site --out docs/coverage.md
          if [ "$(python -c 'import json; print(len(json.load(open("site/v1/manifest.json"))["cities"]))')" -gt 1 ]; then
            python -m latecup_data.report site --us docs/coverage-us.md
          fi
          cp -R site publish
          cd publish
          git init --quiet --initial-branch gh-pages
          git config user.name "latecup-data pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          du -sh v1

      # The address cache changes when new places appear. The coverage reports
      # are committed on Mondays, which also keeps the repository active
      # (GitHub turns off schedules in repositories with no activity for 60 days).
      - name: Commit the address cache and the weekly coverage reports
        run: |
          git config user.name "latecup-data pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data/addresses.json
          if [ "$(date -u +%u)" = "1" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then git add docs/coverage.md docs/coverage-us.md; fi
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit --quiet -m "Address cache and coverage $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do
            git pull --quiet --rebase origin main && git push --quiet origin HEAD:main && exit 0
            sleep 10
          done
          echo "::warning::could not push the address cache; the next run retries"

      - name: New York was kept from the last good feed
        if: steps.build.outputs.first_kept == 'true'
        run: |
          echo "::error::New York could not be built and was kept as it was; the other areas were published. The Build step says why."
          exit 1

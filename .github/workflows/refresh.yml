name: refresh

# Daily: OSM pull -> pipeline -> overrides -> validate -> publish.
# A feed that fails validation, or that lost more than 20 % of its places, is
# not published: the job fails (GitHub emails the owner) and the last good
# feed stays up.
on:
  schedule:
    - cron: "17 9 * * *"   # 04:17 or 05:17 in New York, after the late night
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: Publish even if the feed lost more than 20 % of its places
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["overrides/**", "additions/**", "styles/**", "report.json", "latecup_data/**", "data/**"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Tests (parser, classifier, validator)
        run: python -m pytest -q

      - name: Fetch the published feed
        run: |
          git clone --quiet --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" site || mkdir -p site
          rm -rf site/.git

      - name: Build
        id: build
        env:
          ALLOW: ${{ inputs.allow_shrink && '--allow-shrink' || '' }}
        run: python -m latecup_data.run --site site $ALLOW

      - name: Look up missing street addresses (at most 40 a run)
        id: addresses
        run: |
          python tools/fill_addresses.py site --max 40
          if ! git diff --quiet -- data/addresses.json || [ -n "$(git status --porcelain data/addresses.json)" ]; then
            python -m latecup_data.run --site site
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish (single-commit gh-pages)
        if: steps.build.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m latecup_data.report site --out docs/coverage.md
          cp -R site publish
          cd publish
          git init --quiet --initial-branch gh-pages
          git config user.name "latecup-data pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          du -sh v1

      # The address cache changes when new places appear. The coverage report
      # is committed on Mondays, which also keeps the repository active
      # (GitHub turns off schedules in repositories with no activity for 60 days).
      - name: Commit the address cache and the weekly coverage report
        run: |
          git config user.name "latecup-data pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add data/addresses.json
          if [ "$(date -u +%u)" = "1" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then git add docs/coverage.md; fi
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit --quiet -m "Address cache and coverage $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3; do
            git pull --quiet --rebase origin main && git push --quiet origin HEAD:main && exit 0
            sleep 10
          done
          echo "::warning::could not push the address cache; the next run retries"

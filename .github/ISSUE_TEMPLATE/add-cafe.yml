name: "Add a café"
description: "A late café in New York City that isn't on the map."
title: "Add: "
labels: ["new-cafe"]
body:
  - type: markdown
    attributes:
      value: |
        What belongs: coffee shops, tea and boba shops, and dessert cafés with seats, that close at 20:00 (8 PM) or later at least one day a week. Not bars, hookah lounges, restaurants or delis. New York City only for now.

        The hours have to come from the shop's own website, its own ordering page, its official Instagram or Facebook, or a chain's own store locator. Not Google Maps, Yelp or any other listing site.
  - type: input
    id: place
    attributes:
      label: "Name and street address"
      placeholder: "Example Coffee House, 13 Carmine St"
    validations:
      required: true
  - type: textarea
    id: hours
    attributes:
      label: "Its hours"
      description: "Every day of the week, in plain words. Say which days it's closed."
      placeholder: |
        Mon-Thu 8am-11pm
        Fri-Sat 8am-1am
        Sun 9am-10pm
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Link to the page you read them on"
      placeholder: "https://example.com/visit"
    validations:
      required: true
  - type: input
    id: checked
    attributes:
      label: "The day you read it"
      placeholder: "2026-11-26"
    validations:
      required: true
